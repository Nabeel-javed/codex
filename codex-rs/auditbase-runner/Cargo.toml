[package]
name = "codex-auditbase-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
trusted-fixtures = []

[lib]
name = "codex_auditbase_runner"
path = "src/lib.rs"

[[bin]]
name = "auditbase-v3-runner"
path = "src/main.rs"

[[bin]]
name = "auditbase-v3-fixture-runner"
path = "src/bin/auditbase-v3-fixture-runner.rs"
required-features = ["trusted-fixtures"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
codex-auditbase-contract = { workspace = true }
codex-exec = { workspace = true }
libc = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
